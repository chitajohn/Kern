[package]
name = "kern-desktop"
version = "0.1.0"
description = "Kern desktop"
authors = ["Kern contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kern_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone workspace: the desktop app is not part of the engine workspace.
[workspace]
