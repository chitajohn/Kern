[workspace]
resolver = "2"
members = [
    "crates/kern-core",
    "crates/kern-model",
    "crates/kern-tool",
    "crates/kern-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
description = "Kern — the open-source runtime for reliable, long-running AI agents."

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal", "fs", "net"] }
axum = "0.8"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
mockito = "1"
jsonschema = "0.49"
url = "2"
glob = "0.3"
libc = "0.2"
idna = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.dev]
# Line tables keep panic backtraces useful while keeping dev/test artifacts small.
debug = "line-tables-only"

[profile.release]
lto = "thin"

# Benches run on the dev profile; the numbers are informational smoke targets, not gates.
[profile.bench]
inherits = "dev"
