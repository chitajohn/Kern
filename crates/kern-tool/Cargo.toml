[package]
name = "kern-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kern tool system: Tool trait, registry, builtins, and execution limits."

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
kern-model = { path = "../kern-model" }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockito = { workspace = true }

# Hermetic MCP fixture: an integration test needs a real stdio server, and
# spawning one as a test-owned binary keeps the suite free of node/python.
[[bin]]
name = "kern_mcp_stub"
path = "tests/support/mcp_stub_server.rs"
test = false
bench = false
doc = false
